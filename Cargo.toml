[package]
name = "meca-qs"
version = "0.1.0"
edition = "2024"
description = "Panel TUI para configurar los widgets Quickshell de Omarchy"
repository = "https://github.com/lizarbe513/omarchy-quickshell-config"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.6"
toml_edit = "0.25.15"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
