[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
repository = "https://github.com/lizarbe513/Lizarbe-Ajustes"

[workspace.dependencies]
lizarbe-core = { path = "crates/core" }
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.6"
toml_edit = "0.25.15"
unicode-width = "0.2.2"
tempfile = "3.27.0"
